name: Publicera till GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Samla filer
        run: |
          mkdir dist
          cp index.html app.js style.css sw.js manifest.webmanifest .nojekyll *.png dist/
          cp -r katalog dist/
      - name: Publicera till gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
